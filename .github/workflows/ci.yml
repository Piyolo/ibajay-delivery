name: CI

on:
  push:
    branches: [website-redesign, master, 'apps/**']
  pull_request:

jobs:
  flutter:
    strategy:
      matrix:
        app: [customer_app, vendor_app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze
      - name: Test
        working-directory: ${{ matrix.app }}
        run: flutter test

  web:
    strategy:
      matrix:
        app: [admin_dashboard, IbajayEatsWeb]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Type check + build
        run: |
          if [ "${{ matrix.app }}" = "admin_dashboard" ]; then
            npx tsc --noEmit
          fi
          npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import check
        run: python -c "from app.main import app; print('app imports ok')"
