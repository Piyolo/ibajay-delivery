# Render blueprint — deploys the Ibajay Eats backend.
#
# The website static site (ibajayeatswebsite) is already deployed separately;
# after this deploys, set VITE_API_URL on it to this service's URL and redeploy.
#
# Env vars marked `sync: false` must be filled in the Render dashboard
# (Service → Environment) on first deploy.

services:
  - type: web
    name: ibajayeats-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: no-reply@ibajayeats.linkpc.net
      - key: WAITLIST_NOTIFY_EMAIL
        sync: false
      # website + API share the ibajayeatswebsite.onrender.com origin via proxy,
      # but allow the static site explicitly too
      - key: CORS_ORIGINS
        value: '["https://ibajayeatswebsite.onrender.com"]'
