name: ibajay_eats
description: Ibajay Eats — order from local stores near you.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking (wired up once the FastAPI backend is connected)
  http: ^1.2.1
  web_socket_channel: ^2.4.0

  # Formatting / utils
  intl: ^0.19.0

  # Media & maps (kept ready for real integration; UI works with placeholders for now)
  image_picker: ^1.1.2
  google_maps_flutter: ^2.6.1

  # Local persistence for the auth session token
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: "ic_launcher"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
